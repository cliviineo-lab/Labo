name: SwarmOS C++20 Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -S SwarmOS -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build SwarmOS
      run: |
        cmake --build build --config Release

    - name: Run Unit Tests
      run: |
        ./build/swarmos_tests

    - name: Run Main Execution Pipeline
      run: |
        ./build/swarmos_node
